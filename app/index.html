<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Télécharger Exprime Ta Foi</title>
    <script>
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;

      const androidUrl =
        "https://play.google.com/store/apps/details?id=com.exprimetafoi.exprimetafoi";
      const iosUrl = "https://apps.apple.com/app/id6459265531";

      if (/android/i.test(userAgent)) {
        window.location.href = androidUrl;
      } else if (/iPad|iPhone|iPod/.test(userAgent)) {
        window.location.href = iosUrl;
      } else {
        window.location.href = "https://exprimetafoi.com";
      }
    </script>
  </head>
  <body>
    <p>Redirection vers Exprime Ta Foi…</p>
  </body>
</html>
